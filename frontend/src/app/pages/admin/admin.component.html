<section><div class="page-title"><div><h2>Admin</h2><p>Manage demo users, stocks and trade records.</p></div></div><div class="grid two"><div class="panel"><div class="panel-head"><h3>Stock management</h3></div><form class="admin-form" (ngSubmit)="save()"><div class="form-grid"><input placeholder="Symbol" name="symbol" [(ngModel)]="form.symbol" required><input placeholder="Company" name="company" [(ngModel)]="form.companyName" required><input type="number" placeholder="Price" name="price" [(ngModel)]="form.currentPrice" required><input placeholder="Sector" name="sector" [(ngModel)]="form.sector" required><input type="number" placeholder="P/E" name="pe" [(ngModel)]="form.peRatio"><input type="number" placeholder="EPS" name="eps" [(ngModel)]="form.eps"><input type="number" placeholder="52W High" name="high" [(ngModel)]="form.week52High"><input type="number" placeholder="52W Low" name="low" [(ngModel)]="form.week52Low"><input type="number" placeholder="Day change %" name="change" [(ngModel)]="form.dayChangePercent"></div><button class="primary" type="submit">{{editing?'Update stock':'Add stock'}}</button><button class="secondary" type="button" *ngIf="editing" (click)="reset()">Cancel</button><span class="success">{{message}}</span></form><table><thead><tr><th>Symbol</th><th>Price</th><th>Sector</th><th></th></tr></thead><tbody><tr *ngFor="let s of stocks"><td>{{s.symbol}}</td><td>₹{{s.currentPrice|number:'1.2-2'}}</td><td>{{s.sector}}</td><td><button class="link-btn" (click)="edit(s)">Edit</button><button class="link-btn danger" (click)="remove(s.id)">Delete</button></td></tr></tbody></table></div><div class="panel"><div class="panel-head"><h3>Users</h3></div><div class="list-row" *ngFor="let u of users"><b>{{u.name}}</b><span>{{u.email}}</span><span>{{u.role}}</span></div><div class="panel-head"><h3>Recent trades</h3></div><div class="list-row" *ngFor="let t of trades|slice:0:10"><b>{{t.stock.symbol}}</b><span>{{t.type}} × {{t.quantity}}</span><strong>₹{{t.totalValue|number:'1.2-2'}}</strong></div></div></div></section>
