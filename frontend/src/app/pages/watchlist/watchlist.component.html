<section><div class="page-title"><div><h2>Watchlist</h2><p>Stocks you want to monitor before trading.</p></div></div><div class="cards"><div class="watch-card" *ngFor="let s of rows"><div><b>{{s.symbol}}</b><small>{{s.companyName}}</small></div><strong>₹{{s.currentPrice|number:'1.2-2'}}</strong><span [class.positive]="s.dayChangePercent>=0" [class.negative]="s.dayChangePercent<0">{{s.dayChangePercent|number:'1.2-2'}}%</span><button class="secondary" (click)="remove(s.id)">Remove</button></div></div><div class="panel empty" *ngIf="!rows.length">Your watchlist is empty. Add stocks from the Stocks page.</div></section>
