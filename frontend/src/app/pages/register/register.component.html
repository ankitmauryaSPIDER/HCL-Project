<div class="auth-page"><div class="auth-card"><div class="brand large"><span class="brand-mark">P</span><div><b>PortfolioPro</b><small>Create your account</small></div></div><h2>Create account</h2><form (ngSubmit)="submit()"><label>Full name<input name="name" [(ngModel)]="name" required></label><label>Email<input name="email" type="email" [(ngModel)]="email" required></label><label>Password<input name="password" type="password" [(ngModel)]="password" minlength="6" required></label><button class="primary full" [disabled]="loading">{{loading?'Creating...':'Register'}}</button></form><p class="error" *ngIf="error">{{error}}</p><p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p></div></div>
