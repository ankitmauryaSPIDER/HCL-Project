<section><div class="page-title"><div><h2>Transactions</h2><p>Complete simulated trade history.</p></div></div><div class="panel"><table><thead><tr><th>Time</th><th>Type</th><th>Stock</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody><tr *ngFor="let t of rows"><td>{{t.createdAt|date:'medium'}}</td><td><span class="badge" [class.sell]="t.type==='SELL'">{{t.type}}</span></td><td><b>{{t.symbol}}</b><small>{{t.companyName}}</small></td><td>{{t.quantity}}</td><td>₹{{t.price|number:'1.2-2'}}</td><td>₹{{t.totalValue|number:'1.2-2'}}</td></tr><tr *ngIf="!rows.length"><td colspan="6" class="empty">No transactions yet.</td></tr></tbody></table></div></section>
