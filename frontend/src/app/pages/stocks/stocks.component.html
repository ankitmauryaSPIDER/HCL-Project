<section><div class="page-title"><div><h2>Stocks</h2><p>Seeded demonstration market data.</p></div><input class="search" placeholder="Search symbol or company" [(ngModel)]="q" (input)="load()"></div><div class="panel"><table><thead><tr><th></th><th>Symbol</th><th>Company</th><th>Price</th><th>Day change</th><th>Sector</th><th></th></tr></thead><tbody><tr *ngFor="let s of stocks"><td><button class="star" (click)="toggle(s)">{{isWatch(s.id)?'★':'☆'}}</button></td><td><b>{{s.symbol}}</b></td><td>{{s.companyName}}</td><td>₹{{s.currentPrice|number:'1.2-2'}}</td><td [class.positive]="s.dayChangePercent>=0" [class.negative]="s.dayChangePercent<0">{{s.dayChangePercent|number:'1.2-2'}}%</td><td>{{s.sector}}</td><td><a class="secondary button" [routerLink]="['/stock-details',s.id]">Details</a></td></tr><tr *ngIf="!stocks.length"><td colspan="7" class="empty">No stocks found.</td></tr></tbody></table></div></section>
