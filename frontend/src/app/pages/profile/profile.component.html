<section><div class="page-title"><div><h2>Profile</h2><p>Your PortfolioPro account information.</p></div></div><div class="profile-card panel" *ngIf="u"><div class="avatar large-avatar">{{u.name?.charAt(0)}}</div><div><h3>{{u.name}}</h3><p>{{u.email}}</p><span class="badge">{{u.role}}</span></div><div class="profile-balance"><span>Available balance</span><b>₹{{u.balance|number:'1.2-2'}}</b></div></div></section>
